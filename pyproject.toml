[project]
name = "ocr-bench"
version = "1.0.0"
description = "Offline scoring and paper-number reproduction for a Brazilian-Portuguese OCR cost-versus-precision benchmark"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["ocr", "benchmark", "portuguese", "reproducibility", "vision-language-models"]

# The no-GPU reproduce path is otherwise pure standard library; rapidfuzz is the
# sole runtime dependency, used only for a fast C Levenshtein on the long
# literary NED pages (it returns the identical integer distance to the bundled
# pure-stdlib reference, which remains the fallback if the wheel is absent).
dependencies = [
    "rapidfuzz>=3.6,<4.0",
]

[project.optional-dependencies]
figure = ["matplotlib>=3.8,<4.0"]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<1.0",
]

[project.scripts]
ocr-bench = "ocr_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_bench"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
